services:
  postgres:
    image: postgres:16
    container_name: restaurant-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    user: "root"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/tmp/kafka-logs

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9090:9090"
    environment:
      SERVER_PORT: 9090
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

  order-menu:
    build:
      context: ./services/order-menu
      dockerfile: Dockerfile
    container_name: order-menu
    ports:
      - "8003:8003"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_EVENTS_KAFKA_ENABLED: "true"
      APP_PERSISTENCE_TYPE: sql
      APP_DB_URL: jdbc:postgresql://postgres:5432/restaurant
      APP_DB_USERNAME: restaurant
      APP_DB_PASSWORD: restaurant
      APP_DB_SCHEMA: order_menu
      SERVER_PORT: 8003
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  kitchen-operation:
    build:
      context: ./services/kitchen-operation
      dockerfile: Dockerfile
    container_name: kitchen-operation
    ports:
      - "8004:8004"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_EVENTS_KAFKA_ENABLED: "true"
      ORDER_MENU_CONSUMER_GROUP: kitchen-operation-order-menu
      APP_PERSISTENCE_TYPE: sql
      APP_DB_URL: jdbc:postgresql://postgres:5432/restaurant
      APP_DB_USERNAME: restaurant
      APP_DB_PASSWORD: restaurant
      APP_DB_SCHEMA: kitchen_operation
      SERVER_PORT: 8004
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  kafka_data:
  postgres_data:
