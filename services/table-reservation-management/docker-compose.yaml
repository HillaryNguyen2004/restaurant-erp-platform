version: '3.9'

services:
  table-reservation-management-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: table-reservation-management-service
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/irms_db?schema=public
      KAFKA_BROKER: kafka:9092
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - zookeeper
      - kafka

  postgres:
    image: postgres:16
    container_name: irms-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: irms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - irms_pgdata:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  irms_pgdata: