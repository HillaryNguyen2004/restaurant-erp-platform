services:
  postgres:
    image: postgres:16
    container_name: irms-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: irms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - irms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d irms_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: irms-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: irms-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  user-management-service:
    build:
      context: ./user-management
      dockerfile: Dockerfile.dev
    container_name: user-management-service
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      JWT_SECRET: dev-secret
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/irms_db
      DATABASE_SCHEMA: user_management
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: user-management-service
    volumes:
      - ./user-management:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  table-reservation-management-service:
    build:
      context: ./table-reservation-management
      dockerfile: Dockerfile.dev
    container_name: table-reservation-management-service
    command: sh -c "pnpm prisma migrate deploy && pnpm run start:dev"
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/irms_db?schema=table_reservation
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: table-reservation-management-service
    volumes:
      - ./table-reservation-management:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-menu-service:
    build:
      context: ./order-menu
      dockerfile: Dockerfile
    container_name: order-menu-service
    ports:
      - "8003:8003"
    environment:
      APP_PERSISTENCE_TYPE: sql
      APP_DB_URL: jdbc:postgresql://postgres:5432/irms_db
      APP_DB_USERNAME: postgres
      APP_DB_PASSWORD: mysecretpassword
      APP_DB_SCHEMA: order_menu
      APP_EVENTS_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8003
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kitchen-operation-service:
    build:
      context: ./kitchen-operation
      dockerfile: Dockerfile
    container_name: kitchen-operation-service
    ports:
      - "8004:8004"
    environment:
      APP_PERSISTENCE_TYPE: sql
      APP_DB_URL: jdbc:postgresql://postgres:5432/irms_db
      APP_DB_USERNAME: postgres
      APP_DB_PASSWORD: mysecretpassword
      APP_DB_SCHEMA: kitchen_operation
      APP_EVENTS_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_MENU_CONSUMER_GROUP: kitchen-operation-order-menu
      SERVER_PORT: 8004
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kong:
    image: kong:3.7
    container_name: irms-kong
    ports:
      - "8000:8000"
      - "8010:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      - user-management-service
      - table-reservation-management-service
      - order-menu-service
      - kitchen-operation-service

volumes:
  irms_pgdata:
